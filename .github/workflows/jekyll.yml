name: Deploy Jekyll site to Pages

on:
  # Build and deploy on pushes to the default branch
  push:
    branches: ["main"]
  # Build only (no deploy) for pull requests
  pull_request:
  # Allow manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        # Uploads the './_site' directory by default
        uses: actions/upload-pages-artifact@v5

  deploy:
    # Only deploy from main (push or manual run); pull requests just build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # Do NOT cancel in-progress runs, so production deployments can complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
